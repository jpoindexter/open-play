<!doctype html><html lang="en"><meta charset="utf-8"><title>Open Play drag event diagnostic</title><style>body{margin:0;font:13px system-ui;background:#111;color:#ddd}header{height:40px;padding:4px;box-sizing:border-box}iframe{display:block;width:100%;height:calc(100vh - 170px);border:0}pre{height:120px;overflow:auto;white-space:pre-wrap;margin:4px}</style><header>Drag a library track into a crate. This logs real page events only. <button id="clear">Clear trace</button></header><iframe id="prototype" title="Prototype under drag test" src="./"></iframe><pre id="trace" role="status">Waiting for page…</pre><script type="module">
const frame=document.querySelector('#prototype'),output=document.querySelector('#trace');let events=[];
document.querySelector('#clear').onclick=()=>{events=[];output.textContent='Trace cleared';};
frame.onload=()=>{output.textContent='Ready for a real drag';for(const type of ['pointerdown','pointerup','dragstart','dragenter','dragover','drop','dragend'])frame.contentDocument.addEventListener(type,e=>{if(events.length>60)events.shift();events.push({type,target:e.target.closest('[data-track],[data-crate]')?.outerHTML.slice(0,180)||e.target.tagName,types:e.dataTransfer?[...e.dataTransfer.types]:undefined,data:e.type==='drop'?e.dataTransfer.getData('text/plain'):undefined});output.textContent=JSON.stringify(events,null,2);},true);};
</script></html>
