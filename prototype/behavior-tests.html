<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width"
  /><title>Open Play behavior verification</title
  ><link rel="stylesheet" href="styles.css" />
  <body style="padding: 24px; overflow: auto">
    <h1>Browser behavior verification</h1>
    <p>
      Real Web Audio rendering and module behavior. This does not establish
      native, hardware, UI-equivalence or Serato DSP parity. Test audio is
      disconnected from the speakers.
    </p>
    <button id="run">Run audio and behavior tests</button>
    <p id="summary" role="status">Not run</p>
    <table>
      <thead>
        <tr>
          <th>Test</th>
          <th>Result</th>
          <th>Observed evidence</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
    <script type="module" src="behavior-tests.js"></script>
  </body>
</html>
