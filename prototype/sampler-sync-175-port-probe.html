<!doctype html><html lang="en"><meta charset="utf-8"><title>Worklet port readiness probe</title><body><button id="probe">Probe worklet readiness</button><pre id="result">Not run</pre><script type="module">
document.querySelector('#probe').onclick=async()=>{let context,node,gain;const r={startedAt:new Date().toISOString(),events:[]};try{context=new AudioContext();await context.resume();r.sampleRate=context.sampleRate;await context.audioWorklet.addModule('./warp-loop-worklet.js');node=new AudioWorkletNode(context,'open-play-warp-loop-v1',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});node.port.onmessage=({data})=>r.events.push({at:performance.now(),data});node.onprocessorerror=()=>r.events.push({processorError:true});node.port.postMessage({type:'load',id:1,buffers:[{sampleRate:context.sampleRate,channels:[new Float32Array(128),new Float32Array(128)]}]});await new Promise(resolve=>setTimeout(resolve,250));r.ackBeforeConnection=r.events.some(e=>e.data?.id===1);gain=context.createGain();gain.gain.value=0;node.connect(gain);gain.connect(context.destination);await new Promise(resolve=>setTimeout(resolve,500));r.ackAfterConnection=r.events.some(e=>e.data?.id===1);const metadata={bpm:120,grid:0,duration:2,gridWarpMarkers:[]};const start={track:{...metadata,file:new File([new Uint8Array(2)],'probe.bin')},loop:{start:0,end:1},bpm:120,position:0,when:context.currentTime+.05};node.port.postMessage({type:'start',id:2,options:start});await new Promise(resolve=>setTimeout(resolve,250));r.ackWithFile=r.events.some(e=>e.data?.id===2);node.port.postMessage({type:'start',id:3,options:{...start,track:metadata,when:context.currentTime+.05}});await new Promise(resolve=>setTimeout(resolve,250));r.ackWithGridOnly=r.events.some(e=>e.data?.id===3);}catch(e){r.error={message:e.message,stack:e.stack};}finally{node?.disconnect();gain?.disconnect();await context?.close();document.querySelector('#result').textContent=JSON.stringify(r,null,2);}};
</script></body></html>
